name: Pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_PACKAGE_ROOT: ${{ runner.temp }}/marketplace-tools/node_modules/@deepseek-ai/dsh
      MARKETPLACE_TOOLS_DIR: ${{ runner.temp }}/marketplace-tools
      TYPERT_LOADER: ${{ runner.temp }}/marketplace-tools/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-typert-loader/lib/index.js
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install published DSH and isolated build tools
        run: |
          npm install --prefix "$MARKETPLACE_TOOLS_DIR" --save-exact --ignore-scripts @deepseek-ai/dsh@0.1.7-rc.2 esbuild@0.28.2 playwright@1.62.1
          node scripts/ui-tool-dependencies.mjs > "$RUNNER_TEMP/marketplace-ui-tools.txt"
          mapfile -t ui_tools < "$RUNNER_TEMP/marketplace-ui-tools.txt"
          npm install --prefix "$MARKETPLACE_TOOLS_DIR" --save-exact --ignore-scripts "${ui_tools[@]}"
          node "$MARKETPLACE_TOOLS_DIR/node_modules/playwright/cli.js" install --with-deps chromium
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and pnpm integration tests
        run: pnpm test
      - run: pnpm registry:test
      - run: pnpm discovery:test
      - run: pnpm profile:test
      - name: Profile and RPC integration with target DSH runtime
        run: |
          node --import ./scripts/use-installed-dsh.mjs --experimental-strip-types scripts/profile-test.ts
          node --import ./scripts/use-installed-dsh.mjs --experimental-strip-types scripts/typert-test.ts
      - run: pnpm restart:test
      - run: pnpm self-update:test
      - run: pnpm guided-agent:test
      - name: Browser regressions with published DSH components
        run: pnpm ui:test
      - name: Build plugin
        run: pnpm build
      - name: Verify plugin and generated artifacts
        run: |
          pnpm verify
          pnpm package:test
          git diff --exit-code -- lib

  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test committed package on supported Node baselines
        run: pnpm package:test
